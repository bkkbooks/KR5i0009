body:
  text: 太上道德大天尊説道元一氣經太上道德大天尊説道元一氣經道以一始亦以三成三生萬物形氣合同與天同氣抱道生真氣無形有形化氣存以氣運神神融形形非形形神是氣神形形億千萬氣一神分揉形假合性谷情萌情滋性離氣混神昏非氣之失厥失在心離心無道賊道者心心危道微此語匪空獨見此心乃合性真性合氣合道元中存不賊萬形故已性尊不戕萬情故已性平不麗萬有故已性淸不拂萬化故已性明不著萬法故已性醇不滯一無故已性真不泥無無故已性存存性復命道為之根由三得一一與五并五以一行一化元真真氣衆母萬化藝藝虛靜之府道德之門入門得道道不遠人猶形附氣氣詎離形葆此一氣化為三尊三以一殊是一非三囿三於一一氣真元人各三具未得真元守三求一一氣中傳信斯玄妙第一法壇成三化一歸一還三三三妙合萬妙歸玄敕
