body:
  text: 太上道德大天尊說道元一氣經太上道德大天尊說道元一炁經道以一始亦以三成三生萬物形炁合同與天同炁抱道生眞炁無形有形化炁存以炁運神神融形形非形形神是炁神形形億千萬炁一神分揉形假合性谷情萌情滋性離炁混神昏非炁之失厥失在心離心無道賊道者心心危道微此語匪空獨見此心乃合性眞性合炁合道元中存不賊萬形故已性尊不戕萬情故已性平不麗萬有故已性淸不拂萬化故已性明不著萬法故已性醕不滯一無故已性眞不泥無無故已性存存性復命道爲之根由三得一一與五并五以一行一化元眞眞炁眾母萬化芸芸虛靜之府道德之門入門得道道不遠人猶形附炁炁詎離形葆此一炁化爲三尊三以一殊是一非三囿三於一一炁眞元人各三具未得眞元守三求一一炁中傳信斯玄妙第一法壇成三化一歸一還三三三妙合萬妙歸玄勅
